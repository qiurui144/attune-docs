name: dispatch

# Trigger wiki-portal rebuild when wiki/ changes land on main.
# Pattern E (independent docs repos). All ${{ github.* }} usages
# below are non-user-controlled context vars set by GitHub Actions
# infrastructure (repo / sha / ref) — they are routed via env: into
# jq, never spliced into shell directly.

on:
  push:
    branches: [main, master]
    paths:
      - 'wiki/**'
      - 'wiki.yaml'
      - '.github/workflows/dispatch.yml'

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Build payload
        env:
          SOURCE_REPO: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
          REF_NAME: ${{ github.ref }}
        run: |
          jq -n \
            --arg source_repo "$SOURCE_REPO" \
            --arg commit "$COMMIT_SHA" \
            --arg ref "$REF_NAME" \
            '{source_repo: $source_repo, commit: $commit, ref: $ref}' \
            > payload.json

      - name: Fire repository_dispatch on wiki-portal
        env:
          DISPATCH_TOKEN: ${{ secrets.WIKI_PORTAL_DISPATCH_TOKEN }}
        run: |
          curl -sSf \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $DISPATCH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/qiurui144/wiki-portal/dispatches \
            -d "$(jq -n --arg event 'wiki-content-update' --slurpfile payload payload.json '{event_type: $event, client_payload: $payload[0]}')"
